<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Blog - Register</title>

    <!-- CSS Estáticos locales -->
    <link rel="stylesheet" th:href="@{/css/magnific-popup.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- CSS Externos (Bootstrap & FontAwesome por CDN) -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
    <!-- Navegación común -->
    <nav class="navbar navbar-default navbar-fixed-top">
        <div class="container">
            <div class="navbar-header">
                <a class="navbar-brand" th:href="@{/}">My Blog</a>
            </div>
            <ul class="nav navbar-nav navbar-right">
                <li><a th:href="@{/}">Home</a></li>
                <li><a th:href="@{/blog}">Blog</a></li>
                <li><a th:href="@{/about}">About</a></li>
                <li><a th:href="@{/contact}">Contact</a></li>
                <li sec:authorize="!isAuthenticated()"><a th:href="@{/login}">Login</a></li>
                <li sec:authorize="!isAuthenticated()"><a th:href="@{/register}">Register</a></li>
                <li sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" style="display:inline; margin-top: 8px;">
                        <button type="submit" class="btn btn-default navbar-btn">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <div class="container" style="min-height: 70vh; padding-top: 90px; padding-bottom: 50px;">
        <div class="row">
            <div class="col-xs-12 col-sm-6 col-sm-push-3">
                <h1 style="margin-top: 0;">Register</h1>
                <hr>

                <!-- Formulario de Registro vinculado al objeto 'user' -->
                <form th:action="@{/register}" th:object="${user}" method="post" class="form-horizontal"
                    style="background: #fff; padding: 30px; border: 1px solid #ddd; border-radius: 4px;">

                    <!-- Mensaje de error general si lo hubiera -->
                    <div th:if="${error}" class="alert alert-danger" style="margin-bottom: 20px;">
                        <span th:text="${error}">Error en el registro</span>
                    </div>

                    <div th:if="${#fields.hasGlobalErrors()}">
                        <p class="text-danger" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error global
                        </p>
                    </div>

                    <!-- Campo Nombre -->
                    <div class="form-group" style="margin-bottom: 15px;"
                        th:classappend="${#fields.hasErrors('name')} ? 'has-error' : ''">
                        <label for="name" class="control-label">Name</label>
                        <input type="text" id="name" th:field="*{name}" class="form-control" required
                            placeholder="Your full name">
                        <span class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error
                            Name</span>
                    </div>

                    <!-- Campo Email -->
                    <div class="form-group" style="margin-bottom: 15px;"
                        th:classappend="${#fields.hasErrors('email')} ? 'has-error' : ''">
                        <label for="email" class="control-label">Email</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control" required
                            placeholder="Email address">
                        <span class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error
                            Email</span>
                    </div>

                    <!-- Campo Contraseña (enlazado a plainPassword para el controlador) -->
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="plainPassword" class="control-label">Password</label>
                        <input type="password" id="plainPassword" name="plainPassword" class="form-control" required
                            placeholder="Password">
                    </div>

                    <!-- Checkbox de Términos (Opcional / Sin restricciones de binding estricto) -->
                    <div class="checkbox" style="margin-bottom: 20px;">
                        <label><input type="checkbox" name="agreeTerms"> I agree to the terms and conditions</label>
                    </div>

                    <!-- Botón de envío -->
                    <div class="form-group" style="margin-bottom: 0;">
                        <button type="submit" class="pull-right btn btn-lg sr-button btn-primary"
                            style="width: 100%;">Register</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer común -->
    <footer class="text-center" style="padding: 20px 0; background: #f5f5f5; margin-top: 40px;">
        <div class="container">
            <p>&copy; 2026 Educational Blog - Migrated to Spring Boot 3</p>
        </div>
    </footer>

    <!-- Scripts JavaScript -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <script th:src="@{/js/jquery.magnific-popup.min.js}"></script>
</body>

</html>
