<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <!-- Bloque de contenido que se inyecta en ${templateContent} de base.html -->
    <div th:fragment="content" id="index">

        <!-- Header -->
        <div class="row">
            <div class="col-xs-12 intro">
                <div class="carousel-inner">
                    <div class="item active">
                        <img class="img-responsive" th:src="@{/images/index/woman.jpg}" alt="header picture">
                    </div>
                    <div class="carousel-caption">
                        <h1>FIND NICE PICTURES HERE</h1>
                        <hr>
                    </div>
                </div>
            </div>
        </div>

        <div id="index-body">
            <!-- Pictures Navigation table -->
            <div class="table-responsive">
                <table class="table text-center">
                    <thead>
                        <tr>
                            <!-- Bucle de categorías con th:each e iterStat para saber si es el primer elemento -->
                            <th th:each="category, iterStat : ${categories}"
                                style="border-top: none; display: inline-block;">
                                <a class="link" th:classappend="${iterStat.first} ? 'active' : ''"
                                    th:href="@{'#category' + ${category.id}}" data-toggle="tab"
                                    th:text="${category.name}">Category Name</a>
                            </th>
                        </tr>
                    </thead>
                </table>
                <hr>
            </div>

            <!-- Navigation Table Content -->
            <div class="tab-content">
                <!-- Bucle para el contenido de las pestañas por cada categoría -->
                <div th:each="category, iterStat : ${categories}" th:id="'category' + ${category.id}" class="tab-pane"
                    th:classappend="${iterStat.first} ? 'active' : ''">

                    <div class="row popup-gallery">
                        <!-- Bucle de imágenes de cada categoría -->
                        <div th:each="image : ${category.images}">
                            <!-- Inclusión de fragmento parcial equivalente a include de Twig -->
                            <div th:replace="~{partials/_image :: imageFragment}"></div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- End of Navigation Table Content -->
        </div><!-- End of Index-body box -->

        <!-- Newsletter form -->
        <div class="index-form text-center">
            <h3>SUSCRIBE TO OUR NEWSLETTER </h3>
            <h5>Suscribe to receive our News and Gifts</h5>
            <form class="form-horizontal">
                <div class="form-group">
                    <div class="col-xs-12 col-sm-6 col-sm-push-3 col-md-4 col-md-push-4">
                        <input class="form-control" type="text" placeholder="Type here your email address">
                        <a href="" class="btn btn-lg sr-button">SUBSCRIBE</a>
                    </div>
                </div>
            </form>
        </div>
        <!-- End of Newsletter form -->

        <!-- Box within partners name and logo -->
        <div class="last-box row">
            <div class="col-xs-12 col-sm-4 col-sm-push-4 last-block">
                <div class="partner-box text-center">
                    <p>
                        <i class="fa fa-map-marker fa-2x sr-icons"></i>
                        <span class="text-muted">35 North Drive, Adroukpape, PY 88105, Agoe Telessou</span>
                    </p>
                    <h4>Our Main Partners</h4>
                    <hr>
                    <div class="text-muted text-left">
                        <ul class="list-inline">
                            <li><img th:src="@{/images/index/log2.jpg}" alt="logo"></li>
                            <li>First Partner Name</li>
                        </ul>
                        <ul class="list-inline">
                            <li><img th:src="@{/images/index/log1.jpg}" alt="logo"></li>
                            <li>Second Partner Name</li>
                        </ul>
                        <ul class="list-inline">
                            <li><img th:src="@{/images/index/log3.jpg}" alt="logo"></li>
                            <li>Third Partner Name</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        <!-- End of Box within partners name and logo -->

    </div><!-- End of index box -->

</body>

</html>
