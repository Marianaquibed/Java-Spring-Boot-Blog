<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Blog - Thank You</title>
    <link rel="stylesheet" th:href="@{/css/magnific-popup.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
    <!-- Navegación común -->
    <nav class="navbar navbar-default navbar-fixed-top">
        <div class="container">
            <div class="navbar-header">
                <a class="navbar-brand" th:href="@{/}">My Blog</a>
            </div>
            <ul class="nav navbar-nav navbar-right">
                <li><a th:href="@{/}">Home</a></li>
                <li><a th:href="@{/blog}">Blog</a></li>
                <li><a th:href="@{/about}">About</a></li>
                <li><a th:href="@{/contact}">Contact</a></li>

                <li sec:authorize="isAuthenticated()">
                    <a th:href="@{/blog/new}">New Post</a>
                </li>
                <li sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/admin/categories}">Admin Categories</a>
                </li>
                <li sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/admin/images}">Admin Images</a>
                </li>

                <li sec:authorize="!isAuthenticated()"><a th:href="@{/login}">Login</a></li>
                <li sec:authorize="!isAuthenticated()"><a th:href="@{/register}">Register</a></li>
                <li sec:authorize="isAuthenticated()">
                    <p class="navbar-text">Hola, <span sec:authentication="name">usuario</span></p>
                </li>
                <li sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" style="display:inline; margin-top: 8px;">
                        <button type="submit" class="btn btn-default navbar-btn">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Contenido -->
    <div class="container" style="min-height: 70vh; padding-top: 90px; padding-bottom: 50px;">
        <div class="jumbotron text-center">
            <h1>Thank You!</h1>
            <p class="lead">Thanks for getting in touch with us. We will respond to your message as soon as
                possible.</p>
            <a class="btn btn-primary btn-lg" th:href="@{/}">Back to Home</a>
        </div>
    </div>

    <footer class="text-center" style="padding: 20px 0; background: #f5f5f5; margin-top: 40px;">
        <div class="container">
            <p>&copy; 2026 Educational Blog</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <script th:src="@{/js/jquery.magnific-popup.min.js}"></script>
</body>

</html>
