<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Blog - Contact Us</title>
    <link rel="stylesheet" th:href="@{/css/magnific-popup.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
    <!-- Navegación común -->
    <nav class="navbar navbar-default navbar-fixed-top">
        <div class="container">
            <div class="navbar-header">
                <a class="navbar-brand" th:href="@{/}">My Blog</a>
            </div>
            <ul class="nav navbar-nav navbar-right">
                <li><a th:href="@{/}">Home</a></li>
                <li><a th:href="@{/blog}">Blog</a></li>
                <li><a th:href="@{/about}">About</a></li>
                <li><a th:href="@{/contact}">Contact</a></li>

                <li sec:authorize="isAuthenticated()">
                    <a th:href="@{/blog/new}">New Post</a>
                </li>
                <li sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/admin/categories}">Admin Categories</a>
                </li>
                <li sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/admin/images}">Admin Images</a>
                </li>

                <li sec:authorize="!isAuthenticated()"><a th:href="@{/login}">Login</a></li>
                <li sec:authorize="!isAuthenticated()"><a th:href="@{/register}">Register</a></li>
                <li sec:authorize="isAuthenticated()">
                    <p class="navbar-text">Hola, <span sec:authentication="name">usuario</span></p>
                </li>
                <li sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" style="display:inline; margin-top: 8px;">
                        <button type="submit" class="btn btn-default navbar-btn">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Contenido -->
    <div class="container" style="min-height: 70vh; padding-top: 90px; padding-bottom: 50px;">
        <div class="col-xs-12 col-sm-8 col-sm-push-2">
            <h1>CONTACT US</h1>
            <hr>

            <form th:action="@{/contact}" th:object="${contact}" method="post" class="form-horizontal" novalidate>

                <!-- Resumen de errores de validación -->
                <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                    <p th:each="err : ${#fields.errors('*')}" th:text="${err}" style="margin: 0;"></p>
                </div>

                <div class="form-group" th:classappend="${#fields.hasErrors('firstName')} ? 'has-error' : ''">
                    <div class="col-xs-12 col-sm-6">
                        <label for="firstName" class="control-label">First Name</label>
                        <input type="text" id="firstName" th:field="*{firstName}" class="form-control"
                            placeholder="First Name">
                    </div>
                    <div class="col-xs-12 col-sm-6"
                        th:classappend="${#fields.hasErrors('lastName')} ? 'has-error' : ''">
                        <label for="lastName" class="control-label">Last Name</label>
                        <input type="text" id="lastName" th:field="*{lastName}" class="form-control"
                            placeholder="Last Name">
                    </div>
                </div>

                <div class="form-group" th:classappend="${#fields.hasErrors('email')} ? 'has-error' : ''">
                    <div class="col-xs-12">
                        <label for="email" class="control-label">Email</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control"
                            placeholder="Email address">
                    </div>
                </div>

                <div class="form-group" th:classappend="${#fields.hasErrors('subject')} ? 'has-error' : ''">
                    <div class="col-xs-12">
                        <label for="subject" class="control-label">Subject</label>
                        <input type="text" id="subject" th:field="*{subject}" class="form-control"
                            placeholder="Subject">
                    </div>
                </div>

                <div class="form-group" th:classappend="${#fields.hasErrors('message')} ? 'has-error' : ''">
                    <div class="col-xs-12">
                        <label for="message" class="control-label">Message</label>
                        <textarea id="message" th:field="*{message}" class="form-control" rows="5"
                            placeholder="Your message..."></textarea>
                        <button type="submit" class="pull-right btn btn-lg sr-button"
                            style="margin-top: 15px;">SEND</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <footer class="text-center" style="padding: 20px 0; background: #f5f5f5; margin-top: 40px;">
        <div class="container">
            <p>&copy; 2026 Educational Blog</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <script th:src="@{/js/jquery.magnific-popup.min.js}"></script>
</body>

</html>
