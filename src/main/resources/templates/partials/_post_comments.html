<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <!-- Fragmento parcial reutilizable de comentarios -->
    <div th:fragment="commentFragment" class="comment">

        <h4 th:text="${comment.name}">Author Name</h4>

        <span>
            <i class="fa fa-star sr-icons"></i>
            <i class="fa fa-star sr-icons"></i>
            <i class="fa fa-star sr-icons"></i>
            <i class="fa fa-star sr-icons"></i>
            <i class="fa fa-star sr-icons"></i>
        </span>

        <!-- Fecha y hora del comentario -->
        <p class="time" th:if="${comment.publishedAt != null}"
            th:text="${#temporals.format(comment.publishedAt, 'dd/MM/yyyy HH:mm')}">01/01/2026 12:00</p>
        <hr>

        <!-- Contenido del comentario (th:text escapa HTML) -->
        <p th:text="${comment.text}">Comment text goes here...</p>
    </div>

</body>

</html>
