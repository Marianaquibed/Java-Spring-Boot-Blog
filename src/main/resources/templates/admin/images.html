<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <!-- Bloque de contenido inyectado en la plantilla base -->
    <div th:fragment="content" id="admin-images">
        <div class="container" style="margin-top: 80px; margin-bottom: 50px;">
            <div class="col-xs-12 col-sm-10 col-sm-push-1">
                <h1>Manage Images</h1>

                <!-- Formulario de subida/creación de imágenes (soporta archivos con enctype="multipart/form-data") -->
                <form th:action="@{/admin/images}" th:object="${image}" method="post" enctype="multipart/form-data"
                    class="form-horizontal" style="margin-top: 20px;">

                    <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error en la imagen</div>

                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="imageFile" class="control-label">Upload Image File</label>
                        <input type="file" id="imageFile" name="imageFile" class="form-control" required>
                    </div>

                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="category" class="control-label">Category</label>
                        <select id="category" th:field="*{category}" class="form-control" required>
                            <option value="">Select Category</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Category
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <button type="submit" class="btn btn-lg btn-primary sr-button pull-right" style="width: 100%;">
                            Upload Image
                        </button>
                    </div>
                </form>

                <hr class="divider" style="margin: 40px 0;">

                <!-- Tabla de listado de imágenes existentes -->
                <div class="table-responsive">
                    <table class="table table-striped text-center">
                        <thead>
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">File</th>
                                <th scope="col">Views</th>
                                <th scope="col">Likes</th>
                                <th scope="col">Downloads</th>
                                <th scope="col">Category</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Bucle iterando sobre la lista de imágenes -->
                            <tr th:each="img : ${images}">
                                <th scope="row" th:text="${img.id}">1</th>
                                <td>
                                    <img th:src="@{'/uploads/images/' + ${img.file}}" th:alt="${img.file}" width="100"
                                        style="object-fit: cover; height: 60px;">
                                </td>
                                <td th:text="${img.numViews}">0</td>
                                <td th:text="${img.numLikes}">0</td>
                                <td th:text="${img.numDownloads}">0</td>
                                <td th:text="${img.category != null ? img.category.name : 'Sin categoría'}">Category
                                </td>
                            </tr>
                            <!-- Mensaje si no hay imágenes -->
                            <tr th:if="${images == null or images.isEmpty()}">
                                <td colspan="6" class="text-center text-muted">No images found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
