<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <html xmlns:th="http://www.thymeleaf.org">
    <!-- CSS Estáticos locales -->
    <link rel="stylesheet" th:href="@{/css/magnific-popup.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- CSS Externos (Bootstrap & FontAwesome por CDN) -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>

    <!-- Bloque de contenido inyectado en la plantilla base -->
    <div th:fragment="content" id="categories">
        <div class="container" style="margin-top: 80px; margin-bottom: 50px;">
            <div class="col-xs-12 col-sm-8 col-sm-push-2">
                <h1>Categories</h1>

                <!-- Formulario de creación de categorías (vinculado al objeto 'category' del AdminController) -->
                <form th:action="@{/admin/categories}" th:object="${category}" method="post" class="form-horizontal"
                    style="margin-top: 20px;">

                    <div class="form-group" style="margin-bottom: 15px;"
                        th:classappend="${#fields.hasErrors('name')} ? 'has-error' : ''">
                        <label for="name" class="control-label">Category Name</label>
                        <input type="text" id="name" th:field="*{name}" class="form-control" required
                            placeholder="Enter category name">
                        <span class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error
                            Name</span>
                    </div>

                    <div class="form-group">
                        <button type="submit" class="btn btn-lg btn-primary sr-button pull-right" style="width: 100%;">
                            Add Category
                        </button>
                    </div>
                </form>

                <hr class="divider" style="margin: 40px 0;">

                <!-- Tabla de listado de categorías existentes -->
                <div>
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Name</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Bucle iterando sobre la lista de categorías -->
                            <tr th:each="cat : ${categories}">
                                <th scope="row" th:text="${cat.id}">1</th>
                                <td th:text="${cat.name}">Category Name</td>
                            </tr>
                            <!-- Mensaje si no hay categorías -->
                            <tr th:if="${categories == null or categories.isEmpty()}">
                                <td colspan="2" class="text-center text-muted">No categories found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
