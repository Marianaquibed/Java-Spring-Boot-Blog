<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <!-- Bloque de contenido inyectado en la plantilla base -->
    <div th:fragment="content" id="new-post">
        <div class="container" style="margin-top: 80px; margin-bottom: 50px;">
            <div class="col-xs-12 col-sm-8 col-sm-push-2">
                <h1>New Post</h1>
                <hr>

                <!-- Formulario para crear un post (soporta archivos con enctype="multipart/form-data") -->
                <form th:action="@{/blog/new}" th:object="${post}" method="post" enctype="multipart/form-data"
                    class="form-horizontal">

                    <!-- Errores globales si los hubiera -->
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error en la subida</div>

                    <!-- Campo: Title -->
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="title" class="control-label">Title</label>
                        <input type="text" id="title" th:field="*{title}" class="form-control" required
                            placeholder="Post Title">
                    </div>

                    <!-- Campo: Content -->
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="content" class="control-label">Content</label>
                        <textarea id="content" th:field="*{content}" class="form-control" rows="6" required
                            placeholder="Write your post content here..."></textarea>
                    </div>

                    <!-- Campo: Image File (Multipart) -->
                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="imageFile" class="control-label">Post Image</label>
                        <input type="file" id="imageFile" name="imageFile" class="form-control">
                    </div>

                    <!-- Botón de Envío -->
                    <div class="form-group">
                        <button type="submit" class="btn btn-lg btn-primary sr-button pull-right" style="width: 100%;">
                            Create Post
                        </button>
                    </div>
                </form>

                <hr class="divider">
            </div>
        </div>
    </div>

</body>

</html>
