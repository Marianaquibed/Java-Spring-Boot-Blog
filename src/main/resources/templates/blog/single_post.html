<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <html xmlns:th="http://www.thymeleaf.org">
    <!-- CSS Estáticos locales -->
    <link rel="stylesheet" th:href="@{/css/magnific-popup.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- CSS Externos (Bootstrap & FontAwesome por CDN) -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>

    <!-- Bloque de contenido inyectado en base.html -->
    <div th:fragment="content" id="single">
        <div class="container" style="margin-top: 80px; margin-bottom: 50px;">

            <!-- Full Article -->
            <div class="row">
                <h2 th:text="${post.title}">Post Title</h2>
                <hr class="subtitle">
                <div class="block1">
                    <div class="col-xs-12 col-sm-9">

                        <!-- Imagen del post -->
                        <img th:if="${post.image != null}" th:src="@{'/uploads/images/' + ${post.image}}"
                            th:alt="${post.title}" class="img-responsive margin-bottom-20"
                            style="max-height: 400px; width: 100%; object-fit: cover;">

                        <!-- Contenido (th:text escapa HTML y evita XSS) -->
                        <div th:text="${post.content}"
                            style="margin-top: 15px; margin-bottom: 15px; white-space: pre-line;">
                            Post content here
                        </div>

                        <h4 th:text="'By ' + (${post.postUser != null ? post.postUser.name : 'Anónimo'})">By Author</h4>
                        <hr>

                        <ul class="list-inline">
                            <li th:if="${post.publishedAt != null}"
                                th:text="${#temporals.format(post.publishedAt, 'dd MMMM')} + ' |'">24 October |</li>

                            <li>
                                <a class="page-scroll" href="#form">COMMENT</a>
                                <i class="fa fa-comments sr-icons"></i>
                                <span th:text="${post.comments != null ? post.comments.size() : 0}">0</span> |
                            </li>

                            <li>
                                <a id="like-btn" href="#">LIKE</a>
                                <i class="fa fa-heart sr-icons"></i>
                                <span id="likes" th:text="${post.numLikes}">0</span>
                            </li>
                        </ul>
                    </div>

                    <!-- Sidebar con posts recientes -->
                    <div class="col-xs-12 col-sm-3">
                        <h4>Recent Posts</h4>
                        <hr class="subtitle1">

                        <div th:if="${recents != null}">
                            <div th:each="recent, iterStat : ${recents}">
                                <div th:class="${iterStat.first} ? 'new new1' : 'new'">
                                    <div th:replace="~{partials/_recent_post :: recentPostFragment}"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- End of Full Article -->

            <!-- Comments Section -->
            <div class="row" style="margin-top: 30px;">
                <div class="col-xs-12 col-sm-12 block2">

                    <!-- Comentarios existentes -->
                    <div th:if="${post.comments != null}">
                        <div th:each="comment : ${post.comments}">
                            <div th:replace="~{partials/_post_comments :: commentFragment}"></div>
                        </div>
                    </div>

                    <hr class="line">

                    <!-- Formulario de nuevo comentario -->
                    <div id="form" class="col-xs-12 col-sm-6 col-sm-push-3">
                        <h3>Leave a Comment</h3>
                        <form th:action="@{'/single_post/' + ${post.slug}}" th:object="${comment}" method="post"
                            class="form-horizontal">

                            <div class="form-group" style="margin-bottom: 15px;">
                                <label for="name" class="control-label">Name</label>
                                <input type="text" id="name" th:field="*{name}" class="form-control" required
                                    placeholder="Your name">
                                <small class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name
                                    error</small>
                            </div>

                            <div class="form-group" style="margin-bottom: 15px;">
                                <label for="email" class="control-label">Email</label>
                                <input type="email" id="email" th:field="*{email}" class="form-control" required
                                    placeholder="Your email">
                                <small class="text-danger" th:if="${#fields.hasErrors('email')}"
                                    th:errors="*{email}">Email error</small>
                            </div>

                            <div class="form-group" style="margin-bottom: 15px;">
                                <label for="text" class="control-label">Comment</label>
                                <textarea id="text" th:field="*{text}" class="form-control" rows="4" required
                                    placeholder="Write your comment..."></textarea>
                                <small class="text-danger" th:if="${#fields.hasErrors('text')}"
                                    th:errors="*{text}">Comment error</small>
                            </div>

                            <div class="form-group">
                                <button type="submit" class="btn btn-lg btn-primary sr-button pull-right"
                                    style="width: 100%;">
                                    Post Comment
                                </button>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
            <!-- End of Comments -->

        </div>

        <!-- Script de likes (con token CSRF, si no Spring Security devuelve 403) -->
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function () {
                const postSlug = /*[[${post.slug}]]*/ '';
                const csrfToken = /*[[${_csrf.token}]]*/ '';
                const csrfHeader = /*[[${_csrf.headerName}]]*/ 'X-CSRF-TOKEN';
                const likeLink = document.querySelector('#like-btn');
                const likesSpan = document.querySelector('#likes');

                if (likeLink) {
                    likeLink.addEventListener('click', function (event) {
                        event.preventDefault();
                        fetch('/single_post/' + postSlug + '/like', {
                            method: 'POST',
                            headers: {
                                'X-Requested-With': 'XMLHttpRequest',
                                'Content-Type': 'application/json',
                                [csrfHeader]: csrfToken
                            }
                        })
                            .then(response => response.json())
                            .then(data => {
                                if (data.success) {
                                    likesSpan.textContent = data.numLikes;
                                }
                            })
                            .catch(error => console.error('Error:', error));
                    });
                }
            });
        </script>
    </div>

</body>

</html>
