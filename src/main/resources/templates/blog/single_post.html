<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <!-- Bloque de contenido inyectado en la plantilla base -->
    <div th:fragment="content" id="single">
        <div class="container" style="margin-top: 80px; margin-bottom: 50px;">

            <!-- Full Article -->
            <div class="row">
                <h2 th:text="${post.title}">Post Title</h2>
                <hr class="subtitle">
                <div class="block1">
                    <div class="col-xs-12 col-sm-9">
                        <!-- Imagen del post -->
                        <img th:if="${post.image != null}" th:src="@{'/uploads/images/' + ${post.image}}"
                            th:alt="${post.title}" class="img-responsive margin-bottom-20"
                            style="max-height: 400px; width: 100%; object-fit: cover;">

                        <!-- Contenido del post (renderizado como texto o HTML seguro con th:utext si contiene etiquetas) -->
                        <div th:utext="${post.content}" style="margin-top: 15px; margin-bottom: 15px;">Post content here
                        </div>

                        <h4 th:text="'By ' + (${post.postUser != null ? post.postUser.name : 'Anónimo'})">By Author</h4>
                        <hr>
                        <ul class="list-inline">
                            <!-- Formato de fecha con Thymeleaf (Ej: 24 October) -->
                            <li th:text="${#temporals.format(post.publishedAt, 'dd MMMM')} + ' |'">24 October |</li>

                            <li><a class="page-scroll" href="#form">COMMENT</a> <i class="fa fa-comments sr-icons"></i>
                                <span th:text="${post.numComments}">0</span> |</li>

                            <!-- Script AJAX para manejar los likes de forma asíncrona -->
                            <script th:inline="javascript">
                                document.addEventListener('DOMContentLoaded', function () {
                                    const postSlug = /*[[${post.slug}]]*/ '';
                                    const likeLink = document.querySelector('#like-btn');
                                    const likesSpan = document.querySelector('#likes');

                                    if (likeLink) {
                                        likeLink.addEventListener('click', function (event) {
                                            event.preventDefault();
                                            fetch('/single_post/' + postSlug + '/like', {
                                                method: 'POST',
                                                headers: {
                                                    'X-Requested-With': 'XMLHttpRequest',
                                                    'Content-Type': 'application/json'
                                                }
                                            })
                                                .then(response => response.json())
                                                .then(data => {
                                                    if (data.success) {
                                                        likesSpan.innerHTML = data.numLikes;
                                                    }
                                                })
                                                .catch(error => console.error('Error:', error));
                                        });
                                    }
                                });
                            </script>

                            <li>
                                <a id="like-btn" th:href="@{'/single_post/' + ${post.slug} + '/like'}">LIKE</a>
                                <i class="fa fa-heart sr-icons"></i> <span id="likes"
                                    th:text="${post.numLikes}">0</span>
                            </li>
                        </ul>
                    </div>

                    <!-- Sidebar con posts recientes -->
                    <div class="col-xs-12 col-sm-3">
                        <h4>Recent Posts</h4>
                        <hr class="subtitle1">

                        <div th:if="${recents != null}">
                            <div th:each="recent, iterStat : ${recents}">
                                <div th:class="${iterStat.first} ? 'new new1' : 'new'">
                                    <div th:replace="~{partials/_recent_post :: recentPostFragment}"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- End of Full Article -->

        <!-- Comments Section -->
        <div class="row" style="margin-top: 30px;">
            <div class="col-xs-12 col-sm-12 block2">

                <!-- Listado de comentarios existentes -->
                <div th:if="${post.comments != null}">
                    <div th:each="comment : ${post.comments}">
                        <div th:replace="~{partials/_post_comments :: commentFragment}"></div>
                    </div>
                </div>

                <hr class="line">

                <!-- Formulario para añadir un nuevo comentario -->
                <div id="form" class="col-xs-12 col-sm-6 col-sm-push-3">
                    <h3>Leave a Comment</h3>
                    <form th:action="@{'/single_post/' + ${post.slug}}" th:object="${comment}" method="post"
                        class="form-horizontal">

                        <div class="form-group" style="margin-bottom: 15px;">
                            <label for="author" class="control-label">Name</label>
                            <input type="text" id="author" th:field="*{author}" class="form-control" required
                                placeholder="Your name">
                        </div>

                        <div class="form-group" style="margin-bottom: 15px;">
                            <label for="commentContent" class="control-label">Comment</label>
                            <textarea id="commentContent" th:field="*{content}" class="form-control" rows="4" required
                                placeholder="Write your comment..."></textarea>
                        </div>

                        <div class="form-group">
                            <button type="submit" class="btn btn-lg btn-primary sr-button pull-right"
                                style="width: 100%;">
                                Post Comment
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
        <!-- End of Comments -->
    </div>
    </div>

</body>

</html>
